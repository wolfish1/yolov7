# parameters
nc: 1  # number of classes
depth_multiple: 1.0  # model depth multiple
width_multiple: 1.0  # layer channel multiple

# anchors
anchors:
  - [12,16, 19,36, 40,28]  # P3/8
  - [36,75, 76,55, 72,146]  # P4/16
  - [142,110, 192,243, 459,401]  # P5/32

# yolov7 backbone
backbone:
  # [from, number, module, args] c2, k=1, s=1, p=None, g=1, act=True
  [ [ -1, 1, conv_bn_hswish, [ 16, 3, 2 ] ],              # 0
    [ -1, 1, MobileNet_Block, [ 16,  16, 3, 2, 1, 0 ] ],  # 1
    [ -1, 1, MobileNet_Block, [ 24,  72, 3, 2, 0, 0 ] ],  # 2
    [ -1, 1, MobileNet_Block, [ 24,  88, 5, 1, 0, 0 ] ],
    [ -1, 1, MobileNet_Block, [ 40,  96, 5, 2, 1, 1 ] ],
    [ -1, 1, MobileNet_Block, [ 40, 240, 5, 1, 1, 1 ] ],
    [ -1, 1, MobileNet_Block, [ 40, 240, 3, 1, 1, 1 ] ],
    [ -1, 1, MobileNet_Block, [ 48, 120, 3, 1, 1, 1 ] ],
    [ -1, 1, MobileNet_Block, [ 48, 144, 3, 1, 1, 1 ] ],
    [ -1, 1, MobileNet_Block, [ 96, 288, 3, 2, 1, 1 ] ],
    [ -1, 1, MobileNet_Block, [ 96, 576, 3, 1, 1, 1 ] ],
    [ -1, 1, MobileNet_Block, [ 96, 576, 3, 1, 1, 1 ] ],  # 11
    [ -1, 1, CoordAtt,        [ 96 ] ],
  ]

# yolov7 head
head:
  [[-1, 1, SPPCSPC, [512]], # 13, input = layer 11 (P5, stride 32)

   # FPN: P5 -> P4
   [-1, 1, Conv, [256, 1, 1]],                 # 13, conv on P5
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 14, upsample P5 to stride 16
   [8,  1, Conv, [256, 1, 1]],                 # 15, route backbone P4 (layer 8, stride 16)
   [[-1, -2], 1, Concat, [1]],                 # 16, concat (P4_up, P4), both stride 16

   [-1, 1, Conv, [256, 1, 1]],
   [-2, 1, Conv, [256, 1, 1]],
   [-1, 1, Conv, [128, 3, 1]],
   [-1, 1, Conv, [128, 3, 1]],
   [-1, 1, Conv, [128, 3, 1]],
   [-1, 1, Conv, [128, 3, 1]],
   [[-1, -2, -3, -4, -5, -6], 1, Concat, [1]],
   [-1, 1, Conv, [256, 1, 1]], # 25 (P4 refined, stride 16)

   # FPN: P4 -> P3
   [-1, 1, Conv, [128, 1, 1]],                 # 26
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 27, upsample to stride 8
   [2,  1, Conv, [128, 1, 1]],                 # 28, route backbone P3 (layer 2, stride 8)
   [[-1, -2], 1, Concat, [1]],                 # 29, concat (P3_up, P3), both stride 8

   [-1, 1, Conv, [128, 1, 1]],
   [-2, 1, Conv, [128, 1, 1]],
   [-1, 1, Conv, [64, 3, 1]],
   [-1, 1, Conv, [64, 3, 1]],
   [-1, 1, Conv, [64, 3, 1]],
   [-1, 1, Conv, [64, 3, 1]],
   [[-1, -2, -3, -4, -5, -6], 1, Concat, [1]],
   [-1, 1, Conv, [128, 1, 1]], # 37 (P3 refined, stride 8)

   # PAN: P3 -> P4
   [-1, 1, MP, []],
   [-1, 1, Conv, [128, 1, 1]],
   [-3, 1, Conv, [128, 1, 1]],
   [-1, 1, Conv, [128, 3, 2]],
   [[-1, -3, 24], 1, Concat, [1]],

   [-1, 1, Conv, [256, 1, 1]],
   [-2, 1, Conv, [256, 1, 1]],
   [-1, 1, Conv, [128, 3, 1]],
   [-1, 1, Conv, [128, 3, 1]],
   [-1, 1, Conv, [128, 3, 1]],
   [-1, 1, Conv, [128, 3, 1]],
   [[-1, -2, -3, -4, -5, -6], 1, Concat, [1]],
   [-1, 1, Conv, [256, 1, 1]], # 50 (P4 refined again, stride 16)

   # PAN: P4 -> P5
   [-1, 1, MP, []],
   [-1, 1, Conv, [256, 1, 1]],
   [-3, 1, Conv, [256, 1, 1]],
   [-1, 1, Conv, [256, 3, 2]],
   [[-1, -3, 12], 1, Concat, [1]],

   [-1, 1, Conv, [512, 1, 1]],
   [-2, 1, Conv, [512, 1, 1]],
   [-1, 1, Conv, [256, 3, 1]],
   [-1, 1, Conv, [256, 3, 1]],
   [-1, 1, Conv, [256, 3, 1]],
   [-1, 1, Conv, [256, 3, 1]],
   [[-1, -2, -3, -4, -5, -6], 1, Concat, [1]],
   [-1, 1, Conv, [512, 1, 1]], # 63 (P5 refined, stride 32)

   [37, 1, RepConv, [256, 3, 1]],  # P3 head
   [50, 1, RepConv, [512, 3, 1]],  # P4 head
   [63, 1, RepConv, [1024, 3, 1]], # P5 head

   [[64,65,66], 1, IDetect, [nc, anchors]],   # Detect(P3, P4, P5)
  ]
